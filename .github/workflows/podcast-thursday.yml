name: "Power Back Weekly: Thursday episode"

# Mav's Thursday episode, in his own voice. Written and recorded in Ash HQ → The Q Collective → Podcast.
# Every hour it asks Ash HQ what's ready: a Thursday episode (on or after its Thursday, recorded, not skipped),
# or a bonus episode / trailer (recorded and set to Ready). Each goes into the feed and gets its Q Notes post.
# Apple Podcasts and Spotify read the feed, so they pick it up on their own. Run by hand with a date to force one.
on:
  schedule:
    - cron: "3,23,43 13 * * 4"   # Thursdays 6:03, 6:23, 6:43 AM Mountain (winter): GitHub sometimes skips the hourly run, so Thursday gets extra tries
    - cron: "3,23,43 12 * * 4"   # same, for summer time (6 AM MDT = 12:00 UTC); before 6 AM Ash HQ simply says "not yet"
    - cron: "7 * * * *"   # every hour: Thursday episodes on their Thursday (6 AM Mountain run first), bonus episodes and the trailer within the hour of being set to Ready
  workflow_dispatch:
    inputs:
      date:
        description: "Episode date to publish (YYYY-MM-DD). Leave blank to publish everything that is ready."
        required: false

permissions:
  contents: write

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Make sure ffmpeg is there
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - name: Publish this Thursday's episode
        env:
          EP_DATE: ${{ inputs.date }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SITE_URL: "https://theqcollective.org"
          HQ_OUTBOX_KEY: ${{ secrets.HQ_OUTBOX_KEY }}  # logs each email into Ash HQ -> Outbox
        run: python podcast_thursday.py
      - name: Save it to the site
        run: |
          git config user.name "q-score-bot"
          git config user.email "q-score-bot@users.noreply.github.com"
          git add podcast notes notes.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Power Back Weekly: new episode ($(date -u +%Y-%m-%d))"
          git pull --rebase --autostash origin main
          git push
      - name: Email the team if something failed
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WHAT: "Power Back Weekly Thursday episode"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SITE_URL: "https://theqcollective.org"
          HQ_OUTBOX_KEY: ${{ secrets.HQ_OUTBOX_KEY }}  # logs each email into Ash HQ -> Outbox
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}  # signs the Outbox log if HQ_OUTBOX_KEY is not set
        run: python notify_failure.py
