name: "Power Back Weekly: Thursday episode"

# Mav's Thursday episode, in his own voice. Written and recorded in Ash HQ → The Q Collective → Podcast.
# Every Thursday at 6 AM Mountain: if it's recorded (and not skipped), it goes into the podcast feed
# and gets its Q Notes post. If not, nothing happens. Run by hand with a date to publish a late one.
on:
  schedule:
    - cron: "0 13 * * 4"   # Thursday 13:00 UTC = 6 AM Mountain (7 AM in summer)
    - cron: "0 15 * * 4"   # a second try at 8 AM, in case it was recorded late
  workflow_dispatch:
    inputs:
      date:
        description: "Thursday to publish (YYYY-MM-DD). Leave blank for today."
        required: false

permissions:
  contents: write

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Make sure ffmpeg is there
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - name: Publish this Thursday's episode
        env:
          EP_DATE: ${{ inputs.date }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SITE_URL: "https://theqcollective.org"
        run: python podcast_thursday.py
      - name: Save it to the site
        run: |
          git config user.name "q-score-bot"
          git config user.email "q-score-bot@users.noreply.github.com"
          git add podcast notes notes.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Power Back Weekly: Thursday episode ($(date -u +%Y-%m-%d))"
          git pull --rebase --autostash origin main
          git push
      - name: Email the team if something failed
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WHAT: "Power Back Weekly Thursday episode"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SITE_URL: "https://theqcollective.org"
        run: python notify_failure.py
