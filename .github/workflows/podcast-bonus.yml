name: "Power Back Weekly: bonus episode"

# Bonus episodes and the trailer for Power Back Weekly. Always a draft first:
# a draft is emailed to team@ to listen to, and only "publish" puts it in the podcast feed.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "draft = write and record a bonus episode (emailed to team@, not public). publish = put a draft in the feed. trailer = record the show trailer as a draft."
        type: choice
        options: [draft, publish, trailer]
        default: draft
      source:
        description: "For draft: a bill number (HB26-1001) or a page on the site (cesa-explained.html)"
        required: false
      title:
        description: "Optional episode title"
        required: false
      note:
        description: "Optional note for the writer, like 'focus on what it means for renters'"
        required: false
      draft:
        description: "For publish: the draft id from the email (like bonus-2026-11-20-hb1001-...)"
        required: false

permissions:
  contents: write

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Make sure ffmpeg is there
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - name: Run
        env:
          MODE: ${{ inputs.mode }}
          SOURCE: ${{ inputs.source }}
          TITLE: ${{ inputs.title }}
          NOTE: ${{ inputs.note }}
          DRAFT: ${{ inputs.draft }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SITE_URL: "https://theqcollective.org"
        run: python podcast_bonus.py
      - name: Save it to the site
        run: |
          git config user.name "q-score-bot"
          git config user.email "q-score-bot@users.noreply.github.com"
          git add podcast notes notes.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Power Back Weekly: ${{ inputs.mode }} (${{ inputs.source }}${{ inputs.draft }})"
          git pull --rebase --autostash origin main
          git push
      - name: Email the team if something failed
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WHAT: "Power Back Weekly bonus episode (${{ inputs.mode }})"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SITE_URL: "https://theqcollective.org"
        run: python notify_failure.py
