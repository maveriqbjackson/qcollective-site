<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bill — The Q Collective</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  :root {
    --navy: #1B3A6B; --navy-deep: #122848; --navy-mid: #243f72;
    --gold: #B8962E; --gold-light: #D4AF50; --gold-pale: #F5EDD4;
    --white: #FFFFFF; --off-white: #F9F6F0; --off-white2: #F2EFE8;
    --text: #1a1a1a; --text-light: #4a4a4a; --text-muted: #5a5a5a; --border: #E0D5BE;
  }
  body { background: var(--off-white); font-family: 'DM Sans', sans-serif; color: var(--text); line-height: 1.7; -webkit-font-smoothing: antialiased; margin: 0; }

  .top-stripe { height: 5px; background: linear-gradient(90deg, var(--gold) 0%, var(--gold-light) 50%, var(--gold) 100%); }

  /* TOP BAR */
  .topbar { position: sticky; top: 0; z-index: 50; background: rgba(18,40,72,0.97); backdrop-filter: blur(6px); border-bottom: 1px solid rgba(184,150,46,0.25); }
  .topbar-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 14px 32px; gap: 16px; }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand-q { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 26px; color: var(--gold-light); line-height: 1; }
  .brand-name { font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--white); }
  .topnav { display: flex; align-items: center; gap: 26px; }
  .topnav a { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.7); text-decoration: none; transition: color 0.2s; }
  .topnav a:hover { color: var(--gold-light); }
  .topnav .nav-cta { background: var(--gold); color: var(--navy-deep); padding: 9px 16px; border-radius: 4px; font-weight: 500; }
  .topnav .nav-cta:hover { background: var(--gold-light); color: var(--navy-deep); }

  /* HERO */
  .hero { background: var(--navy-deep); position: relative; overflow: hidden; padding: 92px 32px 84px; }
  .hero-wm { position: absolute; font-family: 'Playfair Display', serif; font-weight: 900; font-size: 640px; line-height: 1; color: rgba(255,255,255,0.06); top: -120px; right: -60px; pointer-events: none; user-select: none; z-index: 0; }
  .hero-wm2 { position: absolute; font-family: 'Playfair Display', serif; font-weight: 900; font-size: 240px; line-height: 1; color: rgba(184,150,46,0.08); bottom: -50px; left: -10px; pointer-events: none; user-select: none; z-index: 0; }
  .hero-inner { max-width: 1100px; margin: 0 auto; position: relative; z-index: 1; }
  .hero-eyebrow { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold-light); opacity: 0.9; margin-bottom: 22px; }
  .hero h1 { font-family: 'Playfair Display', serif; font-size: clamp(40px, 6.5vw, 82px); font-weight: 900; color: var(--white); line-height: 1.0; margin-bottom: 26px; max-width: 16ch; }
  .hero h1 span { color: var(--gold-light); }
  .hero-sub { font-size: clamp(16px, 2vw, 20px); color: rgba(255,255,255,0.72); max-width: 620px; line-height: 1.75; margin-bottom: 18px; }
  .hero-org { font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 1px; color: rgba(255,255,255,0.5); margin-bottom: 38px; }
  .hero-org strong { color: var(--gold-light); font-weight: 500; }
  .hero-cta { display: flex; gap: 14px; flex-wrap: wrap; }
  .btn-gold { display: inline-block; background: var(--gold); color: var(--navy-deep); font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; font-weight: 500; padding: 16px 34px; text-decoration: none; transition: background 0.2s, transform 0.15s; cursor: pointer; border: none; border-radius: 4px; }
  .btn-gold:hover { background: var(--gold-light); transform: translateY(-1px); }
  .btn-outline { display: inline-block; border: 1px solid rgba(255,255,255,0.35); color: rgba(255,255,255,0.85); font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; padding: 16px 34px; text-decoration: none; transition: border-color 0.2s, color 0.2s; cursor: pointer; border-radius: 4px; background: transparent; }
  .btn-outline:hover { border-color: var(--gold-light); color: var(--gold-light); }

  /* COMING SOON STRIP */
  .soon { background: var(--gold); color: var(--navy-deep); text-align: center; padding: 14px 24px; font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500; }

  /* STATS */
  .stats { background: var(--navy); padding: 0; }
  .stats-inner { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
  .stat { padding: 38px 24px; text-align: center; border-right: 1px solid rgba(255,255,255,0.1); }
  .stat:last-child { border-right: none; }
  .stat-num { font-family: 'Playfair Display', serif; font-size: clamp(34px, 4vw, 46px); font-weight: 900; color: var(--gold-light); line-height: 1; margin-bottom: 8px; }
  .stat-label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.7); line-height: 1.5; }

  /* SECTION SHELL */
  .section { padding: 84px 32px; position: relative; overflow: hidden; }
  .section-inner { max-width: 1100px; margin: 0 auto; position: relative; z-index: 1; }
  .section-label { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-bottom: 14px; }
  .section-title { font-family: 'Playfair Display', serif; font-size: clamp(30px, 4.5vw, 50px); font-weight: 700; color: var(--navy-deep); line-height: 1.12; margin-bottom: 18px; }
  .section-divider { width: 52px; height: 3px; background: var(--gold); margin-bottom: 34px; }
  .section-lead { font-size: 17px; color: var(--text-light); line-height: 1.85; max-width: 720px; }
  .section-lead strong { color: var(--text); font-weight: 600; }

  .mission { background: var(--off-white); }
  .mission-wm { position: absolute; font-family: 'Playfair Display', serif; font-weight: 900; font-size: 480px; color: rgba(27,58,107,0.04); top: -60px; right: -40px; pointer-events: none; user-select: none; }
  .standard { margin-top: 34px; background: var(--white); border: 1px solid var(--border); border-left: 4px solid var(--gold); padding: 28px 32px; max-width: 760px; }
  .standard p { font-family: 'Playfair Display', serif; font-size: 19px; font-style: italic; color: var(--navy-deep); line-height: 1.55; }

  /* WORK GRID */
  .work { background: var(--white); border-top: 1px solid var(--border); }
  .work-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; background: var(--border); margin-top: 40px; }
  .work-card { background: var(--off-white); padding: 34px 32px; }
  .work-card .wtag { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); margin-bottom: 12px; }
  .work-card h3 { font-family: 'Playfair Display', serif; font-size: 23px; font-weight: 700; color: var(--navy-deep); line-height: 1.2; margin-bottom: 10px; }
  .work-card p { font-size: 14.5px; color: var(--text-light); line-height: 1.7; }
  .work-card .wmeta { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-muted); margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }

  /* PILLARS */
  .pillars { background: var(--navy-deep); }
  .pillars-wm { position: absolute; font-family: 'Playfair Display', serif; font-weight: 900; font-size: 520px; color: rgba(184,150,46,0.07); top: 50%; left: 50%; transform: translate(-50%,-50%); pointer-events: none; user-select: none; }
  .pillars .section-label { color: var(--gold-light); opacity: 0.9; }
  .pillars .section-title { color: var(--white); }
  .pillars-sub { font-size: 16px; color: rgba(255,255,255,0.66); max-width: 640px; margin-bottom: 40px; }
  .pillar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; }
  .pillar { background: rgba(255,255,255,0.04); border-top: 3px solid var(--gold); padding: 22px 14px; text-align: center; min-height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
  .pillar-num { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 900; color: var(--gold-light); line-height: 1; margin-bottom: 12px; }
  .pillar-name { font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; color: var(--white); line-height: 1.35; }

  /* COMPARE */
  .compare { background: var(--off-white2); }
  .compare-sub { font-size: 17px; color: var(--text-light); line-height: 1.85; max-width: 760px; margin-bottom: 14px; }
  .compare-note { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-muted); margin-bottom: 36px; max-width: 760px; line-height: 1.6; }
  .ctable { background: var(--white); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; box-shadow: 0 10px 30px rgba(18,40,72,0.06); }
  .crow { display: grid; grid-template-columns: 1.1fr 1.3fr 1.3fr; }
  .crow > div { padding: 18px 20px; border-bottom: 1px solid var(--border); font-size: 14px; line-height: 1.55; }
  .crow:last-child > div { border-bottom: none; }
  .crow .clabel { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; color: var(--navy); background: var(--off-white); font-weight: 500; display: flex; align-items: center; }
  .crow .c-fw { color: var(--text); border-left: 3px solid var(--gold); background: #FCFAF3; }
  .crow.chead > div { background: var(--navy-deep); color: var(--white); border-bottom: none; padding: 20px; }
  .crow.chead .clabel { background: var(--navy-deep); color: rgba(255,255,255,0.55); }
  .crow.chead .c-fw { color: var(--gold-light); border-left: 3px solid var(--gold); background: var(--navy-deep); font-weight: 700; }
  .chead .ctitle { font-family: 'Playfair Display', serif; font-size: 18px; line-height: 1.25; }
  .chead .csub { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; opacity: 0.7; margin-top: 4px; }
  .why { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 44px; }
  .why-card { background: var(--white); border: 1px solid var(--border); border-top: 3px solid var(--gold); padding: 26px 24px; }
  .why-card h4 { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 700; color: var(--navy-deep); margin-bottom: 8px; }
  .why-card p { font-size: 14px; color: var(--text-light); line-height: 1.65; }

  /* REPS */
  .reps { background: var(--white); border-top: 1px solid var(--border); }
  .reps-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; margin-top: 36px; align-items: start; }
  .reps-card { background: var(--off-white); border: 1px solid var(--border); padding: 30px 32px; }
  .reps-card h3 { font-family: 'Playfair Display', serif; font-size: 21px; font-weight: 700; color: var(--navy-deep); margin-bottom: 8px; }
  .reps-card p { font-size: 14px; color: var(--text-light); line-height: 1.65; margin-bottom: 18px; }
  .reps-select { width: 100%; font-family: 'DM Sans', sans-serif; font-size: 15px; padding: 14px 16px; border: 1px solid var(--border); background: var(--white); color: var(--text); border-radius: 6px; cursor: pointer; }
  .reps-select:focus { outline: none; border-color: var(--gold); }
  .reps-fed { list-style: none; padding: 0; margin: 16px 0 0; }
  .reps-fed li { padding: 0; }
  .reps-fed a { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 14px; color: var(--navy); text-decoration: none; transition: color 0.2s; }
  .reps-fed li:last-child a { border-bottom: none; }
  .reps-fed a:hover { color: var(--gold); }
  .reps-fed .ext { margin-left: auto; color: var(--gold); font-size: 12px; }

  /* CONTACT */
  .contact { background: var(--navy-deep); position: relative; overflow: hidden; text-align: center; }
  .contact-wm { position: absolute; font-family: 'Playfair Display', serif; font-weight: 900; font-size: 520px; color: rgba(255,255,255,0.04); top: 50%; left: 50%; transform: translate(-50%,-50%); pointer-events: none; user-select: none; }
  .contact-inner { max-width: 680px; margin: 0 auto; position: relative; z-index: 1; }
  .contact .section-label { color: var(--gold-light); opacity: 0.9; }
  .contact h2 { font-family: 'Playfair Display', serif; font-size: clamp(30px, 4.5vw, 48px); font-weight: 700; color: var(--white); line-height: 1.12; margin-bottom: 16px; }
  .contact h2 span { color: var(--gold-light); }
  .contact-lead { font-size: 16px; color: rgba(255,255,255,0.7); line-height: 1.8; margin-bottom: 38px; }
  .contact-methods { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .cmethod { background: rgba(255,255,255,0.05); border: 1px solid rgba(184,150,46,0.3); border-radius: 8px; padding: 24px 32px; min-width: 240px; text-decoration: none; transition: border-color 0.2s, background 0.2s; }
  .cmethod:hover { border-color: var(--gold-light); background: rgba(255,255,255,0.08); }
  .cmethod-label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold-light); margin-bottom: 8px; }
  .cmethod-value { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--white); }
  .cmethod-note { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 6px; }

  /* FOOTER */
  .lp-footer { background: #0d1f3a; padding: 36px 32px; text-align: center; }
  .lp-footer .brand { justify-content: center; margin-bottom: 14px; }
  .lp-footer p { font-family: 'DM Mono', monospace; font-size: 11px; color: rgba(255,255,255,0.45); line-height: 1.8; }
  .lp-footer a { color: var(--gold-light); text-decoration: none; }

  .bottom-stripe { height: 5px; background: linear-gradient(90deg, var(--gold) 0%, var(--gold-light) 50%, var(--gold) 100%); }

  @media (max-width: 900px) {
    .stats-inner { grid-template-columns: repeat(2, 1fr); }
    .stat:nth-child(2) { border-right: none; }
    .pillar-grid { grid-template-columns: repeat(3, 1fr); }
    .work-grid { grid-template-columns: 1fr; }
    .why { grid-template-columns: 1fr; }
    .reps-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 680px) {
    .topnav { display: none; }
    .hero { padding: 64px 22px 60px; }
    .section { padding: 60px 22px; }
    .pillar-grid { grid-template-columns: repeat(2, 1fr); }
    .crow { grid-template-columns: 1fr; }
    .crow > div { border-bottom: 1px solid var(--border); }
    .crow .clabel { background: var(--navy-deep); color: var(--gold-light); }
    .crow .c-fw::before { content: 'Fair Work Act — '; font-family:'DM Mono',monospace; font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--gold); display:block; margin-bottom:4px; }
    .crow.chead { display: none; }
    .hero-wm, .hero-wm2, .mission-wm, .pillars-wm, .contact-wm { display: none; }
  }
  section[id] { scroll-margin-top: 76px; }
  .work-card .card-link { display:inline-block; margin-top:14px; font-family:'DM Mono',monospace; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--gold); text-decoration:none; border-bottom:1px solid transparent; transition:border-color 0.2s; }
  .work-card .card-link:hover { border-bottom-color:var(--gold); }
  /* NEWSLETTER SIGNUP */
  .signup { background: var(--gold); padding: 66px 32px; text-align: center; }
  .signup-inner { max-width: 640px; margin: 0 auto; }
  .signup-eyebrow { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--navy-deep); opacity:0.7; margin-bottom:12px; }
  .signup-title { font-family:'Playfair Display',serif; font-size:clamp(28px,4vw,44px); font-weight:700; color:var(--navy-deep); line-height:1.1; margin-bottom:14px; }
  .signup-sub { font-size:16px; color:#3a2e0a; line-height:1.7; margin-bottom:28px; }
  .signup-form { display:flex; gap:10px; max-width:480px; margin:0 auto; flex-wrap:wrap; justify-content:center; }
  .signup-input { flex:1; min-width:220px; font-family:'DM Sans',sans-serif; font-size:15px; padding:15px 18px; border:none; border-radius:6px; background:#fff; color:var(--text); }
  .signup-input:focus { outline:2px solid var(--navy-deep); }
  .signup-btn { font-family:'DM Mono',monospace; font-size:12px; letter-spacing:2px; text-transform:uppercase; font-weight:500; padding:15px 28px; border:none; border-radius:6px; background:var(--navy-deep); color:var(--gold-light); cursor:pointer; transition:background 0.2s; }
  .signup-btn:hover { background:var(--navy); }
  .signup-btn:disabled { opacity:0.6; cursor:default; }
  .signup-msg { margin-top:16px; font-size:14px; color:var(--navy-deep); font-weight:500; }
  .signup-success { margin-top:6px; font-family:'Playfair Display',serif; font-size:19px; font-style:italic; color:var(--navy-deep); }
  @media (max-width:680px){ .signup { padding:48px 22px; } }

/* ===== your footer styles ===== */
  .footer {
    background: #0f2347;
    border-top: 1px solid rgba(184,150,46,0.2);
    padding: 40px 40px 24px;
  }

  /* -- BALANCE STATEMENT BAND -- */
  .footer-balance {
    max-width: 760px;
    margin: 0 auto 36px;
    padding: 0 0 30px;
    border-bottom: 1px solid rgba(184,150,46,0.18);
    text-align: center;
  }
  .footer-balance-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: #B8962E;
    display: block;
    margin-bottom: 14px;
  }
  .footer-balance p {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    font-style: italic;
    line-height: 1.75;
    color: rgba(255,255,255,0.8);
  }
  .footer-balance em { color: #D4AF50; font-style: italic; }

  .footer-top {
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
    margin-bottom: 32px;
  }

  .footer-brand {
    flex: 0 0 auto;
    max-width: 240px;
  }

  .footer-logo {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 700;
    color: #D4AF50;
    line-height: 1;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }

  .footer-logo span { color: rgba(255,255,255,0.5); font-size: 11px; font-family: 'DM Mono', monospace; font-weight: 400; display: block; margin-top: 6px; letter-spacing: 1.5px; }

  .footer-tagline {
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    line-height: 1.6;
    margin-top: 10px;
  }

  .footer-social {
    display: inline-block;
    margin-top: 16px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.5px;
    color: rgba(255,255,255,0.5);
    text-decoration: none;
    border: 1px solid rgba(184,150,46,0.3);
    padding: 6px 12px;
    transition: color 0.2s, border-color 0.2s;
  }
  .footer-social:hover { color: #D4AF50; border-color: #D4AF50; }

  .footer-nav {
    flex: 1;
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
  }

  .footer-col { flex: 1; min-width: 150px; }

  .footer-col-title {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #B8962E;
    margin-bottom: 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid rgba(184,150,46,0.2);
  }

  /* -- STATE FINDER DROPDOWN -- */
  .footer-state-finder { margin-bottom: 16px; }
  .footer-state-finder label {
    display: block;
    font-size: 11px;
    color: rgba(255,255,255,0.45);
    margin-bottom: 6px;
    line-height: 1.4;
  }
  .footer-state-select {
    width: 100%;
    background: #0a1c3a;
    color: #D4AF50;
    border: 1px solid rgba(184,150,46,0.4);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 9px 10px;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, #B8962E 50%), linear-gradient(135deg, #B8962E 50%, transparent 50%);
    background-position: calc(100% - 16px) center, calc(100% - 11px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  .footer-state-select:focus { outline: none; border-color: #D4AF50; }
  .footer-state-select option { background: #0f2347; color: #fff; }

  .footer-links {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .footer-link {
    color: rgba(255,255,255,0.55);
    text-decoration: none;
    font-size: 13px;
    padding: 5px 0;
    transition: color 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }

  .footer-link:last-child { border-bottom: none; }
  .footer-link:hover { color: #D4AF50; }

  .footer-link .dot {
    width: 5px; height: 5px;
    background: rgba(184,150,46,0.4);
    border-radius: 50%;
    flex-shrink: 0;
  }

  .footer-link .ext {

<script>
function qs(k){var m=new RegExp('[?&]'+k+'=([^&]*)').exec(location.search);return m?decodeURIComponent(m[1]):null;}
function pf(p){p=(p||'').toUpperCase();return p==='D'?'Democrat':p==='R'?'Republican':p==='I'?'Independent':(p||'');}
function submitQForm(e,f){e.preventDefault();var msg=f.querySelector('.qf-msg');msg.className='qf-msg';msg.textContent='Sending\u2026';fetch('https://api.web3forms.com/submit',{method:'POST',body:new FormData(f)}).then(function(r){return r.json();}).then(function(j){if(j.success){var els=f.querySelectorAll('input,select,textarea,button');for(var i=0;i<els.length;i++)els[i].disabled=true;msg.className='qf-msg ok';msg.textContent=f.getAttribute('data-thanks')||'Thank you \u2014 your voice is in.';}else{msg.className='qf-msg err';msg.textContent='Something went wrong. Email team@theQcollective.org and we\u2019ll take it from there.';}}).catch(function(){msg.className='qf-msg err';msg.textContent='Something went wrong. Email team@theQcollective.org and we\u2019ll take it from there.';});return false;}

function taTab(btn,sup){var w=btn.closest('.ta-card');var ts=w.querySelectorAll('.ta-tab');for(var i=0;i<ts.length;i++)ts[i].classList.remove('active');btn.classList.add('active');w.querySelector('#ta-support').style.display=sup?'block':'none';w.querySelector('#ta-oppose').style.display=sup?'none':'block';}
function taCopyMsg(btn){var w=btn.closest('.ta-card');var el=w.querySelector('#ta-support');if(el.style.display==='none')el=w.querySelector('#ta-oppose');el.select();try{navigator.clipboard.writeText(el.value);}catch(e){try{document.execCommand('copy');}catch(e2){}}var o=btn.textContent;btn.textContent='Copied \u2713';setTimeout(function(){btn.textContent=o;},1600);}
function taCopyLink(btn){try{navigator.clipboard.writeText(location.href);}catch(e){}var o=btn.textContent;btn.textContent='Link copied \u2713';setTimeout(function(){btn.textContent=o;},1600);}
function taToggle(btn){var d=btn.nextElementSibling;d.classList.toggle('open');btn.textContent=d.classList.contains('open')?'\u2013 Hide the testimony guide':'+ How to testify on this bill';}
function taFollow(e,f){e.preventDefault();var m=f.querySelector('.ta-fmsg');m.textContent='Saving\u2026';fetch('https://api.web3forms.com/submit',{method:'POST',body:new FormData(f)}).then(function(r){return r.json();}).then(function(){f.reset();m.textContent='Done \u2014 you are on the watch list. We will reach out when live alerts launch.';}).catch(function(){m.textContent='Something went wrong \u2014 please try again.';});return false;}
function _billSaved(n){try{var a=JSON.parse(localStorage.getItem('qc_mybills')||'[]');for(var i=0;i<a.length;i++){if(String(a[i].number)===String(n))return true;}return false;}catch(e){return false;}}
function taStarBill(btn){var n=btn.getAttribute('data-number'),t=btn.getAttribute('data-title');var a;try{a=JSON.parse(localStorage.getItem('qc_mybills')||'[]');}catch(e){a=[];}var i=-1;for(var j=0;j<a.length;j++){if(String(a[j].number)===String(n)){i=j;break;}}if(i>-1){a.splice(i,1);btn.innerHTML='\u2606 Save to My Bills';}else{a.push({number:n,title:t});btn.innerHTML='\u2605 Saved to My Bills';}try{localStorage.setItem('qc_mybills',JSON.stringify(a));}catch(e){}}
function takeAction(number,title){
  var k="da0f4760-ac24-433c-b27f-52058241488e";var ttl=title||number;
  var sup="Dear Representative or Senator,\n\nI am a constituent writing to urge you to SUPPORT "+number+" \u2014 "+ttl+".\n\n[Add one sentence on why this matters to you.]\n\nPlease vote yes. Thank you for your service.\n\nSincerely,\n[Your name] \u00b7 [Your city or ZIP]";
  var opp="Dear Representative or Senator,\n\nI am a constituent writing to urge you to OPPOSE "+number+" \u2014 "+ttl+".\n\n[Add one sentence on why this concerns you.]\n\nPlease vote no. Thank you for your service.\n\nSincerely,\n[Your name] \u00b7 [Your city or ZIP]";
  var eSub=encodeURIComponent("Colorado bill: "+number);var eBody=encodeURIComponent("I am following "+number+" ("+ttl+") on The Q Collective: "+location.href);
  return '<p class="section-label" style="margin-top:44px">Take Action</p><h2 class="section-title" style="margin-bottom:6px">Make your voice count on '+esc(number)+'</h2><div class="section-divider"></div>'
  +'<div class="ta-card"><h3>Contact your representative</h3><p>Copy a message, add a line of your own, and send it to your legislator. <a href="find-officials.html">Find your representative \u2192</a></p>'
  +'<div class="ta-tabs"><button class="ta-tab active" onclick="taTab(this,true)">Support</button><button class="ta-tab" onclick="taTab(this,false)">Oppose</button></div>'
  +'<textarea class="ta-msg" id="ta-support">'+esc(sup)+'</textarea><textarea class="ta-msg" id="ta-oppose" style="display:none">'+esc(opp)+'</textarea>'
  +'<div class="ta-row"><button class="ta-btn" onclick="taCopyMsg(this)">Copy message</button></div></div>'
  +'<div class="ta-card"><h3>Share this bill</h3><p>Put it in front of people who should see it.</p><div class="ta-share">'
  +'<button class="ta-btn ghost" onclick="taCopyLink(this)">Copy link</button>'
  +'<a class="ta-btn ghost" target="_blank" rel="noopener" href="https://www.linkedin.com/sharing/share-offsite/?url='+encodeURIComponent(location.href)+'">LinkedIn</a>'
  +'<a class="ta-btn ghost" href="mailto:?subject='+eSub+'&body='+eBody+'">Email</a></div></div>'
  +'<div class="ta-card"><h3>Testify on it</h3><p>You have the right to speak on any bill at the Colorado legislature \u2014 here is how.</p>'
  +'<button class="ta-toggle" onclick="taToggle(this)">+ How to testify on this bill</button>'
  +'<div class="ta-details"><ol>'
  +'<li><b>Find the hearing.</b> Check this bill\u2019s status above for its committee, then find the hearing date on the <a href="https://leg.colorado.gov" target="_blank" rel="noopener">Colorado General Assembly site \u2197</a>.</li>'
  +'<li><b>Sign up to testify</b> in person or remotely, or submit written testimony through the committee.</li>'
  +'<li><b>Keep it short.</b> You usually get about 3 minutes. Say who you are, whether you support or oppose '+esc(number)+', and one real reason why.</li>'
  +'<li><b>A simple structure:</b> \u201cMy name is ___, I live in ___. I am here to [support/oppose] '+esc(number)+'. This matters to me because ___. I urge a [yes/no] vote. Thank you.\u201d</li>'
  +'</ol></div></div>'
  +'<div class="ta-card"><h3>Follow this bill</h3><p>Save it to your personal <b>My Bills</b> list \u2014 it shows where the bill is in the process and updates as it moves.</p>'
  +'<button class="ta-btn" data-number="'+esc(number)+'" data-title="'+esc(ttl)+'" onclick="taStarBill(this)">'+(_billSaved(number)?'\u2605 Saved to My Bills':'\u2606 Save to My Bills')+'</button>'
  +'<p style="margin:16px 0 8px;font-size:13px;color:var(--text-light)">Want an email when it changes? Join our watch list \u2014 we will notify you once live bill alerts are on.</p>'
  +'<form onsubmit="return taFollow(event,this)"><input type="hidden" name="access_key" value="'+k+'"><input type="hidden" name="subject" value="Watch list \u2014 '+esc(number)+'"><input type="hidden" name="bill" value="'+esc(number)+'">'
  +'<div class="ta-follow"><input type="email" name="email" placeholder="you@email.com" required><button class="ta-btn" type="submit">Join the watch list</button></div>'
  +'<p class="ta-fmsg" style="font-size:12px;color:var(--text-muted);margin:8px 0 0"></p></form></div>';
}

function standForm(number){var k="da0f4760-ac24-433c-b27f-52058241488e";
return '<p class="section-label" style="margin-top:44px">Be Heard</p><h2 class="section-title" style="margin-bottom:6px">Where do you stand on '+esc(number)+'?</h2><div class="section-divider"></div><p style="font-size:13.5px;color:var(--text-light);margin:0 0 6px">Tell us \u2014 we tally constituent positions to show legislators where their district stands.</p>'
+'<div class="qform-wrap"><form class="qform" data-thanks="Recorded \u2014 thank you. Your position is now part of the case we carry." onsubmit="return submitQForm(event,this)"><input type="hidden" name="access_key" value="'+k+'"><input type="hidden" name="subject" value="Where do you stand \u2014 '+esc(number)+'"><input type="hidden" name="bill" value="'+esc(number)+'">'
+'<label>Your position</label><div class="qf-radios"><label><input type="radio" name="position" value="Support" required> Support</label><label><input type="radio" name="position" value="Oppose"> Oppose</label><label><input type="radio" name="position" value="Watching"> Watching</label></div>'
+'<div class="qf-row"><div><label>ZIP (optional)</label><input type="text" name="zip"></div><div><label>Email (optional)</label><input type="email" name="email"></div></div>'
+'<label>Anything to add? (optional)</label><textarea name="comment" placeholder="Optional"></textarea>'
+'<button type="submit">Submit my position</button><p class="qf-consent">We collect these to show legislators their district\u2019s voice. We won\u2019t share your contact info.</p><div class="qf-msg"></div></form></div>';}

function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function statusClass(s){s=(s||'').toLowerCase();if(s.indexOf('pass')>-1||s.indexOf('enact')>-1)return 'st-pass';if(s.indexOf('veto')>-1||s.indexOf('fail')>-1||s.indexOf('dead')>-1)return 'st-fail';return 'st-prog';}
(function(){
var state=qs('state')||'CO', number=qs('number');
var nameEl=document.getElementById('b-name'), subEl=document.getElementById('b-sub'), body=document.getElementById('b-body');
if(!number){nameEl.textContent='No bill selected';body.innerHTML='<p>Head to the <a href="hub.html">Accountability Hub</a> to find a bill.</p>';return;}
nameEl.textContent=number;
fetch('data/'+state+'_bills.json?v='+Date.now()).then(function(r){return r.ok?r.json():null;}).then(function(d){
  if(!d||!d.bills){nameEl.textContent='Not published yet';body.innerHTML='<p>Bill detail for this state isn\u2019t published yet. <a href="hub.html">Back to the Hub</a>.</p>';return;}
  var b=d.bills[number];
  if(!b){nameEl.textContent=number+' \u2014 not found';body.innerHTML='<p>We couldn\u2019t find that bill. <a href="hub.html">Back to the Hub</a>.</p>';return;}
  document.title=number+' \u2014 '+(b.title||'Bill')+' \u2014 The Q Collective';
  nameEl.textContent=number; subEl.innerHTML=esc(b.title||'');
  var html='<div class="bill-status '+statusClass(b.status)+'">'+esc(b.status||'Status unknown')+(b.status_date?' <span class="bs-date">as of '+esc(b.status_date)+'</span>':'')+'</div>';
  if(b.description) html+='<p class="bill-desc">'+esc(b.description)+'</p>';
  if(b.texts&&b.texts.length){html+='<p class="section-label" style="margin-top:36px">The Bill Itself</p><h2 class="section-title" style="margin-bottom:6px">Read the text</h2><div class="section-divider"></div><div class="bill-texts">';
    html+=b.texts.map(function(t){var link=t.state_link||t.url;return link?'<a class="btext" target="_blank" rel="noopener" href="'+esc(link)+'"><span class="bt-type">'+esc(t.type||'Text')+'</span><span class="bt-meta">'+(t.date?esc(t.date)+' \u00b7 ':'')+'official PDF \u2197</span></a>':'';}).join('')+'</div>';}
  if(b.history&&b.history.length){html+='<p class="section-label" style="margin-top:40px">Tracking</p><h2 class="section-title" style="margin-bottom:6px">Every step, start to finish</h2><div class="section-divider"></div><ol class="timeline">';
    html+=b.history.map(function(h){return '<li><span class="tl-date">'+esc(h.date||'')+'</span><span class="tl-action">'+esc(h.action||'')+'</span></li>';}).join('')+'</ol>';}
  if(b.sponsors&&b.sponsors.length){html+='<p class="section-label" style="margin-top:40px">Who\u2019s Behind It</p><h2 class="section-title" style="margin-bottom:6px">Sponsors ('+b.sponsors.length+')</h2><div class="section-divider"></div><div class="sponsor-grid">';
    html+=b.sponsors.map(function(sp){var label=sp.primary?'Prime sponsor':'Co-sponsor';var meta=pf(sp.party);var inner='<span class="sp-name">'+esc(sp.name||'Unknown')+'</span><span class="sp-role">'+label+(meta?' \u00b7 '+meta:'')+'</span>';return sp.people_id?'<a class="sponsor'+(sp.primary?' sp-primary':'')+'" href="legislator.html?state='+encodeURIComponent(state)+'&id='+encodeURIComponent(sp.people_id)+'">'+inner+'<span class="sp-go">View their record \u2192</span></a>':'<div class="sponsor'+(sp.primary?' sp-primary':'')+'">'+inner+'</div>';}).join('')+'</div>';}
  var src=b.state_link||b.url;
  if(src) html+='<p class="bill-source">Official source: <a target="_blank" rel="noopener" href="'+esc(src)+'">Colorado General Assembly \u2197</a></p>';
  html+=takeAction(number,b.title||number);html+=standForm(number);html+='<p style="margin-top:30px"><a href="hub.html">\u2190 Back to the Accountability Hub</a></p>';
  body.innerHTML=html;
}).catch(function(){nameEl.textContent='Could not load';body.innerHTML='<p><a href="hub.html">Back to the Hub</a>.</p>';});
})();
</script>
